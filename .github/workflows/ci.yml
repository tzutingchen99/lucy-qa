name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: node validate-content.js

      - name: Regenerate feed, sitemap, and static post pages
        run: |
          node generate-feed.js
          node generate-sitemap.js
          node generate-pages.js

      - name: Commit regenerated files if changed
        run: |
          git add feed.xml sitemap.xml posts search-index.json index.html 404.html
          if git diff --cached --quiet; then
            echo "產出物已是最新，不需 commit。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate feed, sitemap, and post pages [skip ci]"
            git push
          fi

  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate content
        run: node validate-content.js

      - name: Regenerate feed and sitemap
        run: |
          node generate-feed.js
          node generate-sitemap.js

      - name: Commit regenerated files if changed
        run: |
          if ! git diff --quiet feed.xml sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feed.xml sitemap.xml
            git commit -m "chore: regenerate feed and sitemap [skip ci]"
            git push
          else
            echo "feed.xml / sitemap.xml 已是最新，不需 commit。"
          fi

  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
